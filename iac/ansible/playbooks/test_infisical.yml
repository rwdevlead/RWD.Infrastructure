---
- name: Test Infisical Secret Retrieval
  hosts: localhost
  # become: true

  vars:
    infisical_secret_paths:
      - "/"
      - "/shared"
      - "/ansible"
      - "/ansible/cloudflare"
      - "/ansible/homarr"
      - "/ansible/homeassistant"
      - "/ansible/mail"
      - "/ansible/mailrise"
      - "/ansible/pihole"
      - "/ansible/portainer"
      - "/ansible/watchtower"

  roles:
    - infisical_secrets

  tasks:
    - name: "Test 1 - root secret is promoted to top level"
      assert:
        that:
          - secrets is defined
          - secrets.SECRET is defined
          - secrets.SECRET == 'testing'
        fail_msg: "Test 1 failed: secrets.SECRET is missing or incorrect"

    - name: "Test 2 - path reads were collected"
      assert:
        that:
          - read_results is defined
          - read_results.results is defined
          - read_results.results | length > 0
        fail_msg: "Test 2 failed: read_results did not populate"

    - name: "Test 3 - nested ansible namespace exists"
      assert:
        that:
          - secrets.ansible is defined
          - secrets.ansible | type_debug == 'dict'
        fail_msg: "Test 3 failed: secrets.ansible is missing or not a dict"

    - name: "Test 4 - mail secret is accessible by nested key"
      assert:
        that:
          - secrets.ansible.mail is defined
          - secrets.ansible.mail.OUTLOOK_MAIL_USER is defined
          - secrets.ansible.mail.OUTLOOK_MAIL_USER == 'realworlddevs'
        fail_msg: "Test 4 failed: secrets.ansible.mail.OUTLOOK_MAIL_USER is missing or wrong"

    - name: "Test 5 - watchtower token is accessible by nested key"
      assert:
        that:
          - secrets.ansible.watchtower is defined
          - secrets.ansible.watchtower.API_TOKEN is defined
          - secrets.ansible.watchtower.API_TOKEN | length > 0
        fail_msg: "Test 5 failed: secrets.ansible.watchtower.API_TOKEN is missing or empty"

    - name: "Test 6 - root secret still matches"
      assert:
        that:
          - secrets.SECRET == 'testing'
        fail_msg: "Test 6 failed: root secret mismatch"

    - name: "Test 7 - bracket dotted-key access exists"
      assert:
        that:
          - secrets['ansible.mail'] is defined
          - secrets['ansible.mail']['OUTLOOK_MAIL_USER'] is defined
        fail_msg: "Test failed: secrets['ansible.mail'] bracket access is missing or incomplete"
        success_msg: "Test passed: secrets['ansible.mail'] bracket access verified"
# https://infisical.com/docs/integrations/platforms/ansible#universal-auth
