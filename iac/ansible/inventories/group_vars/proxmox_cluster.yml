---
ansible_user: root

nut_instances:
  pve-d01:
    role: "master"
    ups:
      name: "cyberpower"
      desc: "CyberPower UPS"
      driver: "usbhid-ups"
      port: "auto"
      vendorid: "0764"
      productid: "0501"
    notifications:
      mailrise_url: "smtp://mailrise.local.rwdevs.com:8025"
      mail_from: "nut-g9@local.rwdevs.com"
      mail_recipient: "email@mailrise.xyz"
    vms:
      - name: "dev-docker-02"
        shutdown_tier: 3
        wait_for_stop: true

  pve-p01:
    role: "slave"
    poweroff_tier: 2
    vms:
      - name: "dev-omv-01"
        shutdown_tier: 1
        wait_for_stop: false
      - name: "prod-docker-01"
        shutdown_tier: 2
        wait_for_stop: true

  proxmox:
    role: "slave"
    poweroff_tier: 3
    vms:
      - name: "homeassistant"
        shutdown_tier: 1
        wait_for_stop: false
      - name: "dev-docker-01"
        shutdown_tier: 1
        wait_for_stop: false
      - name: "dev-truenas-01"
        is_storage: true
        shutdown_tier: 3
        wait_for_stop: true
