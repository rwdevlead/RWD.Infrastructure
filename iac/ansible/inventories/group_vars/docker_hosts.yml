ansible_user: ka8kgj
shared_timezone: "America/New_York"

security_fail2ban_enabled: true
security_sysctl_enabled: true
security_firewall_enabled: true
ssh_port: 22

# Pin Docker API version for compatibility across container integrations (Traefik, Watchtower)
shared_docker_api_version: "1.52"
shared_docker_network: "traefik"
docker_base_dir: /opt/docker
docker_base_mnt: /mnt/docker
docker_users:
  - ka8kgj
nfs_mounts:
  - path: "/mnt/docker"
    src: "{{ vms['dev-truenas-01'].ip }}:/mnt/tank/docker/{{ inventory_hostname }}"
    opts: "rw,soft,intr"

pihole_instances:
  prod-docker-01:
    name: "pihole-p01"
    domain: pihole-p01.local.rwdevs.com
    url: "https://pihole-p01.local.rwdevs.com"
    server: "prod-docker-01"
    container: "pihole-p01"
    env_user_pwd: "PIHOLE_P01_PASSWORD"
  dev-docker-02:
    name: "pihole-d02"
    domain: pihole-d02.local.rwdevs.com
    url: "https://pihole-d02.local.rwdevs.com"
    server: "dev-docker-02"
    container: "pihole-d02"
    env_user_pwd: "PIHOLE_D02_PASSWORD"

nebula_sync_url: "http://{{ vms['prod-docker-01'].ip }}:8888/api/auth"
# Pi-hole v6 app endpoints used by nebula-sync
nebula_sync_primary_node: "http://{{ vms['prod-docker-01'].ip }}:8888"
nebula_sync_replica1_node: "http://{{ vms['dev-docker-02'].ip }}:8888"

uptime_kuma_nebula_push_url_success: "https://{{ uptime_kuma.domain }}/api/push/${NEBULA_PUSH_TOKEN}?status=up&msg=Sync+Success"
uptime_kuma_nebula_push_url_fail: "https://{{ uptime_kuma.domain }}/api/push/${NEBULA_PUSH_TOKEN}?status=down&msg=Sync+Failed"

traefik_instance:
  name: "traefik-d02"
  domain: "traefik-d02.local.rwdevs.com"
  server: dev-docker-02
  container: traefik-d02
  url: "https://traefik-d02.local.rwdevs.com"

proxmox_instances:
  - name: "proxmox"
    domain: "proxmox.local.rwdevs.com"
    url: "https://{{ proxmox_nodes['proxmox'].ip }}:8006"
  - name: "pve-d01"
    domain: "pve-d01.local.rwdevs.com"
    url: "https://{{ proxmox_nodes['pve-d01'].ip }}:8006"
  - name: "pve-p01"
    domain: "pve-p01.local.rwdevs.com"
    url: "https://{{ proxmox_nodes['pve-p01'].ip }}:8006"

watchtower_instances:
  dev-docker-02:
    name: watchtower-d02
    email: watchtower-d02@rwdevs.com
    server: dev-docker-02
    container: watchtower-d02
  prod-docker-01:
    name: watchtower-p01
    email: watchtower-p01@rwdevs.com
    ping: "{{ vms['prod-docker-01'].ip }}"

portainer_instance:
  url: "https://portainer-d02.local.rwdevs.com"
  container: portainer-d02
  domain: portainer-d02.local.rwdevs.com

portainer_agents:
  dev-docker-02:
    name: portainer-d02
    description: Development Docker Environment
    server: dev-docker-02
    container: portainer-d02
  prod-docker-01:
    name: portainer-agent-p01
    description: Production Docker Environment
    ping: "{{ vms['prod-docker-01'].ip }}"

mailrise:
  name: mailrise-p01
  domain: "mailrise.local.rwdevs.com"
  email: "email@mailrise.xyz"
  port: 8025

truenas:
  url: "https://truenas-d01.local.rwdevs.com"

homarr:
  container: homarr-d02
  domain: "homarr-d02.local.rwdevs.com"
  port: 7575

homeassistant:
  url: "http://{{ vms['homeassistant'].ip }}:8123"
  href: "http://ha.local.rwdevs.com"
  domain: "ha.local.rwdevs.com"

uptime_kuma:
  container: uptime-kuma-p01
  domain: "uptime-kuma-p01.local.rwdevs.com"
  port: 3001

pulse_instance:
  container: pulse-d02
  domain: "pulse-d02.local.rwdevs.com"
  port: 7655
