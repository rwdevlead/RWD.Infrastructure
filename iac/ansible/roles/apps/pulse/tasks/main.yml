---
- name: Create Pulse directory structure
  ansible.builtin.file:
    path: "{{ pulse_data_dir }}"
    state: directory

- name: Ensure Pulse base directory exists
  ansible.builtin.file:
    path: "{{ pulse_base_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ pulse_base_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Pulse

- name: Deploy and Start Pulse via Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ pulse_base_dir }}"
    state: present
    pull: always
  when: not ansible_check_mode

- name: Wait for Pulse container to be running
  community.docker.docker_container_info:
    name: "{{ pulse_instance.container }}"
  register: pulse_container_info
  until:
    - pulse_container_info.container is not none
    - pulse_container_info.container.State is defined
    - pulse_container_info.container.State.Running | default(false) | bool
  retries: 10
  delay: 3
  when: not ansible_check_mode

- name: Final running state assertion for Pulse
  ansible.builtin.assert:
    that:
      - pulse_container_info.container.State.Running | bool
    fail_msg: "Container {{ pulse_instance.container }} failed to reach running state."
  when: not ansible_check_mode
