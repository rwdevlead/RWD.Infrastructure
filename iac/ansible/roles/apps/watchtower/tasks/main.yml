---
- name: Ensure Watchtower directory exists
  ansible.builtin.file:
    path: "{{ watchtower_base_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render Watchtower .env
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ watchtower_base_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  # Suppress diff output so Watchtower HTTP API token is not exposed in terminal logs
  diff: false
  notify: Restart Watchtower

- name: Render Watchtower docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ watchtower_base_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Watchtower

- name: Deploy Watchtower via Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ watchtower_base_dir }}"
    state: present
  when: not ansible_check_mode
