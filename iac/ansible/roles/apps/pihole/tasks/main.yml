---
- name: Create Pi-hole directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "0"
    group: "0"
    mode: "0755"
  loop:
    - "{{ pihole_base_dir }}"
    - "{{ pihole_base_dir }}/etc-pihole"
    - "{{ pihole_base_dir }}/etc-dnsmasq.d"

- name: Render Pi-hole .env
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ pihole_base_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  # Suppress diff output so Pi-hole web password is not exposed in terminal logs
  diff: false

- name: Deploy Pi-hole docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ pihole_base_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Start Pi-hole container
  community.docker.docker_compose_v2:
    project_src: "{{ pihole_base_dir }}"
    state: present
    pull: always
  when: not ansible_check_mode

- name: Wait for Pi-hole container to become healthy
  community.docker.docker_container_info:
    name: "{{ pihole_instances[inventory_hostname].name }}"
  register: pihole_container_info
  until:
    - pihole_container_info.container is not none
    - pihole_container_info.container.State is defined
    - pihole_container_info.container.State.Health.Status | default('') == "healthy"
  retries: 15
  delay: 10
  when: not ansible_check_mode

- name: Final health assertion
  ansible.builtin.assert:
    that:
      - pihole_container_info.container.State.Health.Status == "healthy"
    fail_msg: "Container {{ pihole_instances[inventory_hostname].name }} failed to reach healthy state."
  when: not ansible_check_mode
