---
- name: Ensure Portainer data directory exists
  ansible.builtin.file:
    path: "{{ portainer_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure Portainer base directory exists
  ansible.builtin.file:
    path: "{{ portainer_base_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure Traefik docker network exists
  community.docker.docker_network:
    name: "{{ shared_docker_network }}"
    state: present

- name: Render Portainer .env
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ portainer_base_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  # Suppress diff output so Portainer agent secret is not exposed in terminal logs
  diff: false

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ portainer_base_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Deploy Portainer via Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ portainer_base_dir }}"
    state: present
    pull: always
  when: not ansible_check_mode

- name: Wait for Portainer container to become healthy
  community.docker.docker_container_info:
    name: "{{ portainer_instance.container }}"
  register: portainer_container_info
  until:
    - portainer_container_info.container is not none
    - portainer_container_info.container.State is defined
    - portainer_container_info.container.State.Health.Status | default('') == "healthy"
  retries: 15
  delay: 5
  when: not ansible_check_mode

- name: Final health assertion for Portainer
  ansible.builtin.assert:
    that:
      - portainer_container_info.container.State.Health.Status == "healthy"
    fail_msg: "Container {{ portainer_instance.container }} failed to reach healthy state."
  when: not ansible_check_mode
