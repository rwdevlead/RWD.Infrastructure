---
- name: Create Portainer Agent directory
  ansible.builtin.file:
    path: "{{ portainer_agent_dir }}"
    state: directory
    owner: "0"
    group: "0"
    mode: "0755"

- name: Render Portainer Agent .env
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ portainer_agent_dir }}/.env"
    owner: "0"
    group: "0"
    mode: "0600"
  # Suppress diff output so Portainer agent secret is not exposed in terminal logs
  diff: false

- name: Deploy Portainer Agent docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ portainer_agent_dir }}/docker-compose.yml"
    owner: "0"
    group: "0"
    mode: "0644"

- name: Start Portainer Agent container
  community.docker.docker_compose_v2:
    project_src: "{{ portainer_agent_dir }}"
    state: present
    pull: always
  when: not ansible_check_mode

- name: Wait for Portainer Agent container to be running
  community.docker.docker_container_info:
    name: "{{ portainer_agents[inventory_hostname].name }}"
  register: portainer_agent_container_info
  until:
    - portainer_agent_container_info.container is not none
    - portainer_agent_container_info.container.State is defined
    - portainer_agent_container_info.container.State.Running | default(false) | bool
  retries: 10
  delay: 3
  when: not ansible_check_mode

- name: Final running state assertion for Portainer Agent
  ansible.builtin.assert:
    that:
      - portainer_agent_container_info.container.State.Running | bool
    fail_msg: "Container {{ portainer_agents[inventory_hostname].name }} failed to reach running state."
  when: not ansible_check_mode
