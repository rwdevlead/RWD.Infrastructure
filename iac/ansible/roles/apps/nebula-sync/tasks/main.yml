---
- name: Ensure Nebula Sync directory exists
  ansible.builtin.file:
    path: "{{ nebula_sync_base_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render Nebula Sync .env
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ nebula_sync_base_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  # Suppress diff output so Pi-hole passwords and Uptime Kuma push token are not exposed in terminal logs
  diff: false
  notify: Restart Nebula Sync

- name: Render Nebula Sync docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ nebula_sync_base_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Nebula Sync

- name: Deploy Nebula Sync via Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ nebula_sync_base_dir }}"
    state: present
    pull: always
  when: not ansible_check_mode

- name: Wait for Nebula Sync container to be running
  community.docker.docker_container_info:
    name: nebula-sync
  register: nebula_sync_container_info
  until:
    - nebula_sync_container_info.container is not none
    - nebula_sync_container_info.container.State is defined
    - nebula_sync_container_info.container.State.Running | default(false) | bool
  retries: 10
  delay: 3
  when: not ansible_check_mode

- name: Final running state assertion for Nebula Sync
  ansible.builtin.assert:
    that:
      - nebula_sync_container_info.container.State.Running | bool
    fail_msg: "Container nebula-sync failed to reach running state."
  when: not ansible_check_mode
