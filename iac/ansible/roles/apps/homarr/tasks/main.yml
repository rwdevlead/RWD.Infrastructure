- name: Create Homarr base directory
  file:
    path: "{{ homarr_base_dir }}"
    state: directory
    owner: root
    group: docker
    mode: "0775"

- name: Deploy docker compose file
  template:
    src: docker-compose.yml.j2
    dest: "{{ homarr_base_dir }}/docker-compose.yml"
  notify: Restart Homarr

- name: Start Homarr container
  community.docker.docker_compose_v2:
    project_src: "{{ homarr_base_dir }}"
    state: present
  check_mode: false
  when: not ansible_check_mode

- name: Wait for Homarr to respond via Traefik
  uri:
    url: "https://{{ homarr.domain }}"
    status_code: 200
    validate_certs: false
  register: homarr_health
  retries: 10
  delay: 5
  until: homarr_health.status == 200
  check_mode: false
  when: not ansible_check_mode
