- name: Create Homarr base directory
  file:
    path: "{{ homarr_base_dir }}"
    state: directory
    owner: root
    group: docker
    mode: "0775"

- name: Render Homarr .env
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ homarr_base_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  # Suppress diff output so Homarr encryption key is not exposed in terminal logs
  diff: false
  notify: Restart Homarr

- name: Deploy docker compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ homarr_base_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Homarr

- name: Start Homarr container
  community.docker.docker_compose_v2:
    project_src: "{{ homarr_base_dir }}"
    state: present
  # Keep check_mode disabled defensively alongside the when-guard so container startup never runs in dry-run
  check_mode: false
  when: not ansible_check_mode

- name: Wait for Homarr to respond via Traefik
  uri:
    url: "https://{{ homarr.domain }}"
    status_code: 200
    validate_certs: false
  register: homarr_health
  retries: 10
  delay: 5
  until: homarr_health.status == 200
  # Skip endpoint polling in --check mode since the container is not started during dry-runs
  check_mode: false
  when: not ansible_check_mode
