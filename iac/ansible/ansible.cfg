[defaults]
collections_path = ./collections:~/.ansible/collections
inventory = ./inventories
roles_path = ./roles
# Disable host key checking because reprovisioned homelab VMs rotate SSH host keys
host_key_checking = False
retry_files_enabled = False
stdout_callback = ansible.builtin.default
callback_result_format = yaml
interpreter_python = auto_silent
# Suppress noisy collection/core deprecation warnings during routine playbook runs
deprecation_warnings = False

[ssh_connection]
host_key_auto_add = True
# Allow password auth for initial VM bootstrap before SSH keys are deployed; skip strict host checking for rebuilt VMs
ssh_args = -o PasswordAuthentication=yes -o StrictHostKeyChecking=no
